[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bwiza-sft"
version = "0.1.0"
description = "SFT stack for AI Bwiza instruct training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "safetensors>=0.4",
  "torch>=2.3",
  "transformers>=4.45",
  "wandb>=0.17",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
